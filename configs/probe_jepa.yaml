model:
  checkpoint: checkpoints/pretrain_jepa_v1/epoch99.ckpt
  freeze_encoder: true
  d: 256
  L: 6
  k: 8

training:
  batch_size: 256
  lr_encoder: 0.0  # unused when frozen, kept for schema symmetry with finetune configs
  lr_heads: 1.0e-3
  weight_decay: 0.05
  epochs: 30
  grad_clip: 1.0
  lambda_direction: 1.0
  lambda_classification: 0.5

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 594]
  val_batches: [595, 627]
  test_batches: [628, 660]

logging:
  project: neutrinojepa
  run_name: jepa_probe_v1

checkpoint:
  dirpath: checkpoints/jepa_probe_v1/
  filename: "epoch{epoch}"
