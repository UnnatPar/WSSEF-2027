model:
  d: 256
  L: 6
  k: 8
  ema_decay: 0.996

masking:
  ratio_min: 0.4
  ratio_max: 0.6
  n_clusters: 4

training:
  batch_size: 256
  # 2e-4, not 1e-3: proactive, same reasoning as configs/pretrain_mae.yaml's
  # training.lr -- NeutrinoJEPA shares the same PETEncoder (models/pet.py)
  # that was confirmed, via a controlled A/B on real data reproducing this
  # config's own cosine schedule shape, to hit a sudden over-smoothing
  # collapse at lr=1e-3 even with LR warmup and LayerScale both applied.
  # This experiment hasn't run in production yet this session, but there's
  # no reason to expect it's immune to the same architecture-level failure.
  lr: 2.0e-4
  weight_decay: 0.05
  epochs: 100
  grad_clip: 1.0
  num_workers: 8

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 50]
  val_batches: [595, 627]

logging:
  project: neutrinojepa
  run_name: pretrain_jepa_v1

checkpoint:
  dirpath: checkpoints/pretrain_jepa_v1/
  filename: "epoch{epoch:04d}-step{step:09d}"
