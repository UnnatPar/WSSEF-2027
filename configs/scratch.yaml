model:
  # no checkpoint field: SupervisedFineTune builds a random-init PETEncoder
  # when checkpoint_path is None. This is experiment 3.
  freeze_encoder: false
  d: 256
  # L: 6 -> 4. Three independent measurements on scratch_v4's checkpoint
  # converged on blocks 1-3 contributing little: LayerScale gate magnitude
  # (blocks 0-3 barely moved off init, 1.4-2.6x, vs blocks 4-5's 6-10x),
  # representation-change (blocks 1-3 near-identity, cosine(in,out)
  # 0.96-0.99, vs block0's 0.795 and blocks 4-5's 0.56-0.63), and a
  # layer-wise linear probe (block0/1 indistinguishable from random guess,
  # real signal only from block2, most of the gain in blocks 4-5). This is
  # the one change in this batch WITHOUT a direct reinit-and-retrain causal
  # confirmation -- a real bet on the converging evidence, not a certainty,
  # made instead of paying for that extra confirming run first (see the
  # ledger's 2026-08-13 probe-battery entries for the full evidence).
  L: 4
  # k: 8 -> 12. Confirmed directly on scratch_v4's checkpoint: sweeping k at
  # inference (no retrain) on the k=8-trained model gave k=12 -0.40 deg and
  # k=16 -0.42 deg (both better than k=8), while k=4/k=6 were worse as
  # expected (+2.39/+0.68) -- the model under-utilizes available
  # neighborhood context at k=8. k=12 chosen over k=16 (nearly identical
  # inference-time gain) since it's cheaper per knn_graph call.
  k: 12
  # split_direction_head NOT set here (defaults to false, the joint head) --
  # see models/heads.py's DirectionHead docstring. split=True's evidence
  # (probe4) came from a frozen, already-good encoder; applying it
  # unconditionally to this fully-cold-start (encoder AND heads both random)
  # regime caused scratch_v6/v7 to collapse before either branch escaped
  # random noise. configs/finetune_mae.yaml opts in instead, matching what
  # was actually tested.

training:
  batch_size: 256
  lr_encoder: 1.0e-4
  lr_heads: 1.0e-3
  weight_decay: 0.05
  epochs: 50
  grad_clip: 1.0
  # 4 -> 2: see configs/probe_mae.yaml's training.num_workers comment --
  # running multiple of these jobs concurrently at num_workers=4 each
  # OOM-killed a worker.
  num_workers: 2
  lambda_direction: 1.0
  lambda_classification: 0.5
  early_stopping_patience: 5
  # See configs/finetune_mae.yaml's training.direction_warmup_steps and
  # vmf_blend_weight comments for the full mechanism (including why a hard
  # switch to pure vMF at the warmup boundary alone was NOT sufficient) --
  # direction_head/kappa_head are freshly initialized here (same as
  # everywhere else SupervisedFineTune is used), so the same cold-start vMF
  # collapse applies. Back to 3000, matching scratch_v4's proven-safe
  # setting for the joint head (see model.split_direction_head below for why
  # this config no longer uses the split head -- the 10000-step extension
  # tried in v6/v7 was a reactive patch for a problem that no longer applies
  # once the joint head is back).
  direction_warmup_steps: 3000
  vmf_blend_weight: 0.05

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 25]  # spec: "use 5M = ~25 batches" -- NOT the full 594-batch train pool, which would try to index ~117M events and thrash the file cache
  val_batches: [595, 627]
  test_batches: [628, 660]

logging:
  project: neutrinojepa
  run_name: scratch_v8

checkpoint:
  # v8, not v7: v7 (direction_warmup_steps extended to 10000, still using
  # the split head) ALSO collapsed -- direct checkpoint inspection at step
  # 9,551 (still inside pure-cos-distance warmup, before vMF could be
  # involved at all) showed both az and zen branches already collapsing
  # toward near-constant, deeply-saturated outputs. This proved the warmup
  # extension didn't address the real cause: two independently-initialized
  # branches struggling to coordinate on one joint 3D loss through a fully
  # random `g`, not a vMF/kappa-triggered collapse. v8 reverts to the joint
  # DirectionHead (model.split_direction_head unset above) instead of
  # patching warmup length again -- the split fix moves to
  # configs/finetune_mae.yaml, where the encoder starts pretrained/good,
  # matching what the split was actually validated against. v6/v7 are not
  # safe to resume from. v8's changes vs v4, all still carried over:
  # ModelCheckpoint now actually tracks val/angular_error (v4's real best
  # checkpoint, 65.63 deg, was silently overwritten by this exact bug);
  # encode_event's mean-pool branch dropped (confirmed zero-cost ablation);
  # k 8->12, L 6->4; explicit aux_frac concatenated onto g.
  dirpath: checkpoints/scratch_v8/
  filename: "epoch{epoch:04d}-step{step:09d}"
