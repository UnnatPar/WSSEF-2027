model:
  # no checkpoint field: SupervisedFineTune builds a random-init PETEncoder
  # when checkpoint_path is None. This is experiment 3.
  freeze_encoder: false
  d: 256
  L: 6
  k: 8

training:
  batch_size: 256
  lr_encoder: 1.0e-4
  lr_heads: 1.0e-3
  weight_decay: 0.05
  epochs: 50
  grad_clip: 1.0
  # 4 -> 2: see configs/probe_mae.yaml's training.num_workers comment --
  # running multiple of these jobs concurrently at num_workers=4 each
  # OOM-killed a worker.
  num_workers: 2
  lambda_direction: 1.0
  lambda_classification: 0.5
  early_stopping_patience: 5
  # See configs/finetune_mae.yaml's training.direction_warmup_steps and
  # vmf_blend_weight comments for the full mechanism (including why a hard
  # switch to pure vMF at the warmup boundary alone was NOT sufficient) --
  # direction_head/kappa_head are freshly initialized here (same as
  # everywhere else SupervisedFineTune is used), so the same cold-start vMF
  # collapse applies.
  direction_warmup_steps: 3000
  vmf_blend_weight: 0.05

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 25]  # spec: "use 5M = ~25 batches" -- NOT the full 594-batch train pool, which would try to index ~117M events and thrash the file cache
  val_batches: [595, 627]
  test_batches: [628, 660]

logging:
  project: neutrinojepa
  run_name: scratch_v4

checkpoint:
  # v4, not v3: v3 (direction-loss blend + encoder LR warmup) still
  # collapsed by step 30,922 (az/zen std 0.0034/0.0000) despite the encoder
  # itself confirmed healthy (node_emb std=0.57) -- traced to
  # DirectionHead's own internal layers having no normalization, fixed in
  # models/heads.py. v3 followed v2 (pool_norm fix, still hit the vMF
  # cold-start collapse), which followed v1 (pool_proj fed unnormalized
  # into direction_head). None are safe to resume from.
  dirpath: checkpoints/scratch_v4/
  filename: "epoch{epoch:04d}-step{step:09d}"
