model:
  # no checkpoint field: SupervisedFineTune builds a random-init PETEncoder
  # when checkpoint_path is None. This is experiment 3.
  freeze_encoder: false
  d: 256
  L: 6
  k: 8

training:
  batch_size: 256
  lr_encoder: 1.0e-4
  lr_heads: 1.0e-3
  weight_decay: 0.05
  epochs: 50
  grad_clip: 1.0
  num_workers: 4
  lambda_direction: 1.0
  lambda_classification: 0.5
  early_stopping_patience: 5

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 25]  # spec: "use 5M = ~25 batches" -- NOT the full 594-batch train pool, which would try to index ~117M events and thrash the file cache
  val_batches: [595, 627]
  test_batches: [628, 660]

logging:
  project: neutrinojepa
  run_name: scratch_v2

checkpoint:
  # v2, not v1: v1's checkpoints were trained with pool_proj's output fed
  # unnormalized straight into direction_head/kappa_head -- global_add_pool
  # inside encode_event() makes the pooled embedding's magnitude scale
  # almost linearly with event size (measured r=0.98 correlation, norm 76 at
  # 25 pulses vs 512-604 at 256 pulses across 256 real events), which
  # saturated direction_head's sigmoid and collapsed its output to a
  # near-constant (std=0.00045) within the first few thousand steps. See
  # models/pet.py's PETEncoder.pool_norm for the fix. Starting fresh keeps
  # the diagnostic clean -- v1's checkpoints are not safe to resume from.
  dirpath: checkpoints/scratch_v2/
  filename: "epoch{epoch:04d}-step{step:09d}"
