model:
  # no checkpoint field: SupervisedFineTune builds a random-init PETEncoder
  # when checkpoint_path is None. This is experiment 3.
  freeze_encoder: false
  d: 256
  # L: 4, k: 12 -- BOTH REVERTED to v4's original 6/8. scratch_v8 (L=4, k=12,
  # joint head -- otherwise architecturally identical to v4) collapsed the
  # same way v6/v7 did (kappa pinned at floor, az/zen deeply saturated),
  # despite the head itself being unchanged from v4's 160k+-step-proven-safe
  # version. Root-caused to L=4 and/or k=12 specifically: both were only
  # ever validated post-hoc, via inference-time analysis (LayerScale gate
  # magnitude, representation-change cosine, a layer-wise probe, and an
  # inference-only k-sweep) on scratch_v4's ALREADY-CONVERGED checkpoint --
  # none of that evidence says anything about whether a shallower/wider
  # network is harder to get through COLD-START optimization, a completely
  # different question. mae_finetune_v6 (same dropped-mean-pool and
  # aux_frac changes, but L=6/k=8, encoder pretrained not cold) trains
  # fine, narrowing suspicion to L/k specifically rather than the pooling
  # or aux_frac changes (g's statistics in the collapse diagnostic also
  # looked completely normal, further weakening those two as causes).
  # Reverting both at once rather than isolating further -- the probe
  # evidence for L=4/k=12 was for a converged model's efficiency/accuracy,
  # never claimed cold-start safety, so there's little lost by giving up
  # both together here.
  L: 6
  k: 8
  # split_direction_head NOT set here (defaults to false, the joint head) --
  # see models/heads.py's DirectionHead docstring. split=True's evidence
  # (probe4) came from a frozen, already-good encoder; applying it
  # unconditionally to this fully-cold-start (encoder AND heads both random)
  # regime caused scratch_v6/v7 to collapse before either branch escaped
  # random noise. configs/finetune_mae.yaml opts in instead, matching what
  # was actually tested.

training:
  batch_size: 256
  lr_encoder: 1.0e-4
  lr_heads: 1.0e-3
  weight_decay: 0.05
  epochs: 50
  grad_clip: 1.0
  # 4 -> 2: see configs/probe_mae.yaml's training.num_workers comment --
  # running multiple of these jobs concurrently at num_workers=4 each
  # OOM-killed a worker.
  num_workers: 2
  lambda_direction: 1.0
  lambda_classification: 0.5
  early_stopping_patience: 5
  # See configs/finetune_mae.yaml's training.direction_warmup_steps and
  # vmf_blend_weight comments for the full mechanism (including why a hard
  # switch to pure vMF at the warmup boundary alone was NOT sufficient) --
  # direction_head/kappa_head are freshly initialized here (same as
  # everywhere else SupervisedFineTune is used), so the same cold-start vMF
  # collapse applies. Back to 3000, matching scratch_v4's proven-safe
  # setting for the joint head (see model.split_direction_head below for why
  # this config no longer uses the split head -- the 10000-step extension
  # tried in v6/v7 was a reactive patch for a problem that no longer applies
  # once the joint head is back).
  direction_warmup_steps: 3000
  vmf_blend_weight: 0.05

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 25]  # spec: "use 5M = ~25 batches" -- NOT the full 594-batch train pool, which would try to index ~117M events and thrash the file cache
  val_batches: [595, 627]
  test_batches: [628, 660]

logging:
  project: neutrinojepa
  run_name: scratch_v9

checkpoint:
  # v9, not v8: v8 (L=4, k=12, joint head) ALSO collapsed by step 39,065 --
  # kappa pinned at floor (mean=1.0079, std=0.0000), az/zen deeply saturated
  # (az std=0.0009, zen std=0.0000), the identical signature v6/v7 showed,
  # despite v8's head being unchanged from v4's proven-safe joint version.
  # See model.L/model.k's comment above for the full diagnosis: L/k reverted
  # to v4's original 6/8, since both were only validated post-hoc on an
  # already-converged model, never for cold-start trainability specifically.
  # v6/v7/v8 are not safe to resume from. v9's changes vs v4, all still
  # carried over: ModelCheckpoint now actually tracks val/angular_error
  # (v4's real best checkpoint, 65.63 deg, was silently overwritten by this
  # exact bug); encode_event's mean-pool branch dropped (confirmed
  # zero-cost ablation, and g's statistics stayed normal through every
  # collapse observed so far -- not implicated); explicit aux_frac
  # concatenated onto g (same -- not implicated by any collapse evidence).
  # If v9 ALSO collapses, the remaining unexplained-by-L/k possibility is
  # aux_frac or the pooling change after all, or something not yet
  # isolated -- would need actual ablation at that point, not further
  # inference from mae_finetune_v6's non-identical comparison.
  dirpath: checkpoints/scratch_v9/
  filename: "epoch{epoch:04d}-step{step:09d}"
