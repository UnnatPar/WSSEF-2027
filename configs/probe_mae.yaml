model:
  checkpoint: checkpoints/pretrain_mae_v6/  # v6: v5's weights still collapsed (warmup alone only delayed it) -- LayerScale + 5x lower peak LR fixed it, see models/pet.py's PETBlock; resolved to the latest available *.ckpt at runtime, not hardcoded to a specific epoch
  freeze_encoder: true
  d: 256
  L: 6
  k: 8

training:
  batch_size: 256
  lr_encoder: 0.0  # unused when frozen, kept for schema symmetry with finetune configs
  lr_heads: 1.0e-3
  weight_decay: 0.05
  epochs: 30
  grad_clip: 1.0
  # 4 -> 2: running probe and finetune concurrently on the same box, each
  # with num_workers=4 persistent parquet-caching workers (8 total), grew
  # real memory usage from ~1.5GB to 123GB/216GB over several hours and
  # OOM-killed one of probe's dataloader workers mid-validation
  # ("DataLoader worker exited unexpectedly"). 2 halves the persistent
  # worker/cache footprint per job.
  num_workers: 2
  lambda_direction: 1.0
  lambda_classification: 0.5
  early_stopping_patience: 5
  # See configs/finetune_mae.yaml's training.direction_warmup_steps for the
  # full mechanism -- SupervisedFineTune's direction_head/kappa_head are
  # freshly initialized here too (only the encoder is loaded from a
  # checkpoint), so the same cold-start vMF collapse applies.
  direction_warmup_steps: 3000

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 25]  # spec: "use 5M = ~25 batches" -- NOT the full 594-batch train pool, which would try to index ~117M events and thrash the file cache
  val_batches: [595, 627]
  test_batches: [628, 660]

logging:
  project: neutrinojepa
  run_name: mae_probe_v1

checkpoint:
  dirpath: checkpoints/mae_probe_v1/
  filename: "epoch{epoch:04d}-step{step:09d}"
