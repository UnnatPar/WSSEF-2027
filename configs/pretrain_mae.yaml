model:
  d: 256
  L: 6
  k: 8
  mask_ratio: 0.25

training:
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.05
  # 100 was a nominal/never-reachable cap (~9 days of A100 time at measured
  # throughput). It also silently neutered the cosine LR schedule added
  # after discovering the real production plateau: CosineAnnealingLR's
  # T_max tracks Trainer.estimated_stepping_batches, which scales with this
  # value -- at epochs=100, ~185k real steps in was only ~4.75% through the
  # schedule, so LR had barely decayed (~99.4% of its initial value),
  # explaining why the plateau persisted even after adding decay. 8 is a
  # real, achievable target (~3-4 more epochs, ~7-9hr, from where a real
  # production run currently is) that lets the schedule actually complete.
  epochs: 8
  grad_clip: 1.0
  # 8 gets a dataloader worker SIGKILL'd by the host OOM killer after ~1,560
  # steps on a real Colab A100 despite ample system RAM at start -- smells
  # like a per-step leak in the dataloader/worker path, not yet root-caused.
  # 2 avoided it past step 7,900 on the real production run (2026-08-03).
  num_workers: 2

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 50]
  val_batches: [595, 627]

logging:
  project: neutrinojepa
  run_name: pretrain_mae_v5

checkpoint:
  # v5, not v4: v4's checkpoints were trained with NO LR warmup -- the
  # cosine schedule started at full peak LR (1e-3) on step 1. Confirmed via
  # a controlled A/B on real data (same seed/data/architecture/step count,
  # only the warmup differed) that this alone collapses PETEncoder's node
  # embedding cross-sample std from a healthy 0.68 at init to 0.004 within
  # 20 real AdamW steps, and it never recovered (0.0004 by step 20,426 in
  # the real v4 run) -- independent of and prior to the separate
  # LayerNorm-gain-decay collapse v4 already fixed (gains were confirmed
  # stable at ~1.0 throughout v4's whole run, yet predictions were still
  # exactly constant: pred std=0.00000 for both time and charge). A
  # 100-step linear warmup under otherwise identical conditions kept std
  # 60-100x higher throughout and reached a genuinely lower loss. See
  # train/optim.py's warmup_cosine_lr_lambda for the full mechanism.
  # v4 followed v3 (LayerNorm-gain decay from weight_decay), which followed
  # v2 (collapsed-ReLU dead units). Starting fresh keeps the diagnostic
  # clean each time -- v4's checkpoints are not safe to resume from.
  dirpath: checkpoints/pretrain_mae_v5/
  filename: "epoch{epoch:04d}-step{step:09d}"
