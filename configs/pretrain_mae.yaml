model:
  d: 256
  L: 6
  k: 8
  mask_ratio: 0.25

training:
  batch_size: 256
  # 1e-3 (was): confirmed via a controlled A/B on real data, reproducing
  # production's actual cosine schedule shape (total_steps=312,504, so LR
  # barely decays across the first several thousand steps -- a schedule
  # that itself decays to ~0 within the short test horizon was tried first
  # and failed to reproduce the collapse at all), that 1e-3 causes a sudden
  # over-smoothing phase transition: node embedding cross-sample std stayed
  # healthy for ~2,200 steps then collapsed 500x within ~200 more, even
  # with LR warmup AND LayerScale (models/pet.py's PETBlock) both applied.
  # 2e-4 (5x lower), combined with the same warmup+LayerScale, stayed
  # healthy (std 0.31-0.65) through a full 8,000-step test -- 3.5x past
  # where the unfixed combination had already collapsed.
  lr: 2.0e-4
  weight_decay: 0.05
  # 100 was a nominal/never-reachable cap (~9 days of A100 time at measured
  # throughput). It also silently neutered the cosine LR schedule added
  # after discovering the real production plateau: CosineAnnealingLR's
  # T_max tracks Trainer.estimated_stepping_batches, which scales with this
  # value -- at epochs=100, ~185k real steps in was only ~4.75% through the
  # schedule, so LR had barely decayed (~99.4% of its initial value),
  # explaining why the plateau persisted even after adding decay. 8 is a
  # real, achievable target (~3-4 more epochs, ~7-9hr, from where a real
  # production run currently is) that lets the schedule actually complete.
  epochs: 8
  grad_clip: 1.0
  # 8 gets a dataloader worker SIGKILL'd by the host OOM killer after ~1,560
  # steps on a real Colab A100 despite ample system RAM at start -- smells
  # like a per-step leak in the dataloader/worker path, not yet root-caused.
  # 2 avoided it past step 7,900 on the real production run (2026-08-03).
  num_workers: 2

data:
  max_pulses: 256
  batch_dir: data/train/
  meta_path: data/train_meta.parquet
  geometry_path: data/sensor_geometry.csv
  train_batches: [1, 50]
  val_batches: [595, 627]

logging:
  project: neutrinojepa
  run_name: pretrain_mae_v6

checkpoint:
  # v6, not v5: v5 added LR warmup alone, which only delayed the collapse
  # (healthy for ~2,200 steps, then a sudden 500x drop in node embedding
  # diversity within ~200 more) rather than preventing it -- confirmed on
  # the real v5 run itself (pred std=0.00000 again by step 4,313) and
  # reproduced in a controlled A/B. v6 adds the two-part real fix:
  # LayerScale (models/pet.py's PETBlock) plus a 5x lower peak LR (see
  # training.lr above) -- both held healthy through a full 8,000-step
  # controlled test. v5 followed v4 (missing LR warmup entirely), which
  # followed v3 (LayerNorm-gain decay from weight_decay), which followed v2
  # (collapsed-ReLU dead units). Starting fresh keeps the diagnostic clean
  # each time -- v5's checkpoints are not safe to resume from.
  dirpath: checkpoints/pretrain_mae_v6/
  filename: "epoch{epoch:04d}-step{step:09d}"
